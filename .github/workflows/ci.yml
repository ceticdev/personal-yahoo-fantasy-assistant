name: CI

# No Yahoo credentials, no repository secrets, and no live Yahoo access are
# used or required anywhere in this workflow. The suite runs entirely against
# synthetic fixtures and mocks.

on:
  push:
    branches: ["main", "hardening/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so `git archive` and the release check have a real ref.
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Fresh editable install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the full test suite
        run: pytest -rs

      - name: Secret scan (filenames and categories only)
        run: python scripts/secret_scan.py

      - name: Clean release archive check
        run: python scripts/make_release.py --ref HEAD

      - name: Upload release archive
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: yahoo-fantasy-mcp-v2-release
          path: dist/yahoo-fantasy-mcp-v2.zip
          if-no-files-found: error

  hygiene:
    name: repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject whitespace errors
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD

      - name: Reject tracked build artifacts and secrets
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(\.pytest_cache|__pycache__|\.pyc$|(^|/)\.env$|token.*\.json$|credential.*\.json$|\.pem$|\.key$|\.venv|egg-info|(^|/)build(/|$))'; then
            echo "::error::tracked path matches a forbidden pattern"
            exit 1
          fi
          echo "no forbidden tracked paths"

      - name: Confirm .env.example is tracked and .env is ignored
        run: |
          set -euo pipefail
          git ls-files --error-unmatch .env.example
          printf 'x' > .env
          git check-ignore -v .env
          rm .env
